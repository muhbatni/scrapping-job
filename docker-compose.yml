services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: jobassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobassist_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-jobassist_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jobassist}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobassist-network

  # ============================================
  # Backend API (NestJS)
  # ============================================
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobassist-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-jobassist}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jobassist_secret_2024}
      - POSTGRES_DB=${POSTGRES_DB:-jobassist_db}
      - JWT_SECRET=${JWT_SECRET:-job-assist-jwt-super-secret-key-2024}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-7d}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-10}
      - THROTTLE_TTL=${THROTTLE_TTL:-60}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-100}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - UPLOAD_DIR=${UPLOAD_DIR:-./uploads}
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - jobassist-network

  # ============================================
  # Crawler Service (Playwright + Cheerio)
  # ============================================
  crawler-service:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: jobassist-crawler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_started
    environment:
      - NODE_ENV=development
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-jobassist}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jobassist_secret_2024}
      - POSTGRES_DB=${POSTGRES_DB:-jobassist_db}
      - CRAWLER_CONCURRENCY=${CRAWLER_CONCURRENCY:-3}
      - CRAWLER_TIMEOUT=${CRAWLER_TIMEOUT:-30000}
      - BACKEND_URL=http://backend-api:3000
    ports:
      - '${CRAWLER_PORT:-3001}:3001'
    networks:
      - jobassist-network

  # ============================================
  # Scheduler Service (Cron Jobs)
  # ============================================
  scheduler-service:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: jobassist-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_started
      crawler-service:
        condition: service_started
    environment:
      - NODE_ENV=development
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-jobassist}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jobassist_secret_2024}
      - POSTGRES_DB=${POSTGRES_DB:-jobassist_db}
      - CRAWLER_URL=http://crawler-service:3001
      - BACKEND_URL=http://backend-api:3000
    ports:
      - '${SCHEDULER_PORT:-3002}:3002'
    networks:
      - jobassist-network

  # ============================================
  # Frontend (Vue.js 3 + Vite)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobassist-frontend
    restart: unless-stopped
    depends_on:
      - backend-api
    environment:
      - VITE_API_URL=${VITE_API_URL:-/api}
    ports:
      - '${FRONTEND_PORT:-80}:80'
    networks:
      - jobassist-network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  jobassist-network:
    driver: bridge
